server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/json application/xml image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 'healthy\n';
        add_header Content-Type text/plain;
    }

    # Static Assets Caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Single Page Application (SPA) Fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API Reverse Proxies to bypass CORS
    location /api/transport/ {
        proxy_pass https://v6.db.transport.rest/;
        proxy_set_header Host v6.db.transport.rest;
        proxy_ssl_server_name on;
    }

    location /api/autobahn/ {
        proxy_pass https://verkehr.autobahn.de/o/autobahn/;
        proxy_set_header Host verkehr.autobahn.de;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
        proxy_ssl_server_name on;
    }

    location /api/overpass/ {
        proxy_pass https://overpass-api.de/api/;
        proxy_set_header Host overpass-api.de;
        proxy_ssl_server_name on;
    }

    location /api/opensensemap/ {
        proxy_pass https://api.opensensemap.org/;
        proxy_set_header Host api.opensensemap.org;
        proxy_ssl_server_name on;
    }

    location /api/pegelonline/ {
        proxy_pass https://www.pegelonline.wsv.de/;
        proxy_set_header Host www.pegelonline.wsv.de;
        proxy_ssl_server_name on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
